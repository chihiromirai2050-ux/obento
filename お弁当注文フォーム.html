<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>お弁当注文フォーム</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=DM+Serif+Display:ital@0;1&family=M+PLUS+Rounded+1c:wght@700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --green-deep:   #1a3d2b;
    --green-mid:    #2d6a4f;
    --green-bright: #52b788;
    --green-pale:   #d8f3dc;
    --cream:        #faf7f2;
    --warm-white:   #fffef9;
    --orange-accent:#e07a2f;
    --orange-light: #fdf0e3;
    --text-dark:    #1c1c1c;
    --text-mid:     #4a4a4a;
    --text-light:   #8a8a8a;
    --shadow-card:  0 4px 24px rgba(26,61,43,0.10), 0 1px 4px rgba(26,61,43,0.06);
    --shadow-hover: 0 12px 40px rgba(26,61,43,0.18), 0 2px 8px rgba(26,61,43,0.10);
    --radius: 18px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: 'Noto Sans JP', sans-serif;
    background: var(--cream);
    color: var(--text-dark);
    min-height: 100vh;
  }

  /* ── HEADER ── */
  .header {
    background: var(--green-deep);
    padding: 0;
    position: relative;
    overflow: hidden;
  }
  .header::before {
    content: '';
    position: absolute;
    top: -60px; right: -60px;
    width: 260px; height: 260px;
    background: radial-gradient(circle, rgba(82,183,136,0.18) 0%, transparent 70%);
    pointer-events: none;
  }
  .header::after {
    content: '';
    position: absolute;
    bottom: -40px; left: 10%;
    width: 180px; height: 180px;
    background: radial-gradient(circle, rgba(82,183,136,0.10) 0%, transparent 70%);
    pointer-events: none;
  }
  .header-inner {
    max-width: 780px;
    margin: 0 auto;
    padding: 36px 20px 32px;
    position: relative;
    z-index: 1;
  }
  .header-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: rgba(82,183,136,0.18);
    border: 1px solid rgba(82,183,136,0.35);
    color: var(--green-bright);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.1em;
    padding: 5px 14px;
    border-radius: 100px;
    margin-bottom: 16px;
    text-transform: uppercase;
  }
  .header-title {
    font-family: 'DM Serif Display', serif;
    font-size: clamp(28px, 5vw, 44px);
    color: #fff;
    line-height: 1.15;
    margin-bottom: 10px;
  }
  .header-title em { font-style: italic; color: var(--green-bright); }
  .header-sub {
    color: rgba(255,255,255,0.55);
    font-size: 13px;
    line-height: 1.7;
  }
  .header-meta {
    margin-top: 20px;
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
  }
  .header-meta-item {
    display: flex;
    align-items: center;
    gap: 8px;
    color: rgba(255,255,255,0.75);
    font-size: 13px;
    font-weight: 500;
  }
  .header-meta-item .icon {
    width: 28px; height: 28px;
    background: rgba(255,255,255,0.08);
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px;
  }
  .deadline-chip {
    margin-top: 18px;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--orange-accent);
    color: #fff;
    font-size: 13px;
    font-weight: 700;
    padding: 8px 18px;
    border-radius: 100px;
    box-shadow: 0 4px 16px rgba(224,122,47,0.4);
  }

  /* ── MAIN ── */
  .main {
    max-width: 780px;
    margin: 0 auto;
    padding: 32px 16px 80px;
  }

  /* NAME SECTION */
  .name-section {
    background: var(--warm-white);
    border-radius: var(--radius);
    padding: 24px 20px;
    margin-bottom: 28px;
    box-shadow: var(--shadow-card);
    border: 1px solid rgba(26,61,43,0.06);
  }
  .section-label {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--green-mid);
    margin-bottom: 10px;
  }
  .name-select-wrap { position: relative; }
  .name-select-wrap::after {
    content: '▾';
    position: absolute;
    right: 16px; top: 50%;
    transform: translateY(-50%);
    color: var(--green-mid);
    pointer-events: none;
    font-size: 14px;
  }
  select {
    width: 100%;
    padding: 14px 44px 14px 18px;
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 15px;
    font-weight: 500;
    color: var(--text-dark);
    background: var(--cream);
    border: 2px solid rgba(26,61,43,0.12);
    border-radius: 12px;
    appearance: none;
    cursor: pointer;
    transition: border-color 0.2s, box-shadow 0.2s;
    outline: none;
  }
  select:focus {
    border-color: var(--green-bright);
    box-shadow: 0 0 0 4px rgba(82,183,136,0.15);
  }
  select.error-field { border-color: #e05252; }

  /* ── MENU SECTION ── */
  .menu-section {
    background: var(--warm-white);
    border-radius: var(--radius);
    padding: 24px 20px;
    margin-bottom: 28px;
    box-shadow: var(--shadow-card);
    border: 1px solid rgba(26,61,43,0.06);
  }
  .menu-section-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }

  /* SEARCH */
  .search-wrap {
    position: relative;
    flex: 1;
    min-width: 180px;
    max-width: 320px;
  }
  .search-wrap .search-icon {
    position: absolute; left: 12px; top: 50%;
    transform: translateY(-50%);
    color: var(--text-light);
    font-size: 14px;
    pointer-events: none;
  }
  .search-input {
    width: 100%;
    padding: 10px 36px 10px 36px;
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 13px;
    color: var(--text-dark);
    background: var(--cream);
    border: 2px solid rgba(26,61,43,0.10);
    border-radius: 100px;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
    appearance: none;
  }
  .search-input:focus {
    border-color: var(--green-bright);
    box-shadow: 0 0 0 3px rgba(82,183,136,0.12);
  }
  .search-clear {
    display: none;
    position: absolute; right: 10px; top: 50%;
    transform: translateY(-50%);
    background: none; border: none;
    color: var(--text-light); font-size: 15px;
    cursor: pointer; padding: 4px;
    line-height: 1;
  }

  /* SERIES */
  .series-block { margin-bottom: 4px; }
  .series-label-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 14px 0 6px;
    margin: 0;
    border-bottom: 2px solid var(--series-border);
    margin-bottom: 8px;
  }
  .series-name {
    font-size: 13px;
    font-weight: 800;
    letter-spacing: 0.04em;
    color: var(--text-dark);
  }

  /* MENU BUTTONS */
  .menu-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
    margin-bottom: 6px;
  }
  .menu-btn {
    position: relative;
    background: var(--btn-bg, var(--cream));
    border: 2px solid var(--btn-border, rgba(26,61,43,0.08));
    border-radius: 12px;
    padding: 12px 12px 10px;
    cursor: pointer;
    text-align: left;
    transition: transform 0.18s cubic-bezier(.34,1.4,.64,1), box-shadow 0.18s, border-color 0.15s, background 0.15s;
    -webkit-user-select: none; user-select: none;
    outline: none;
    min-height: 72px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .menu-btn:active { transform: scale(0.97); }
  .menu-btn:hover {
    box-shadow: var(--shadow-hover);
    transform: translateY(-2px);
  }
  .menu-btn.selected {
    border-color: var(--green-bright);
    background: var(--green-pale);
    box-shadow: var(--shadow-hover), 0 0 0 3px rgba(82,183,136,0.18);
    transform: translateY(-2px);
  }
  .menu-btn.dimmed { opacity: 0.32; pointer-events: none; }

  .btn-check {
    position: absolute; top: 8px; right: 8px;
    width: 22px; height: 22px;
    background: var(--green-bright);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    opacity: 0; transform: scale(0.4);
    transition: opacity 0.18s, transform 0.22s cubic-bezier(.34,1.4,.64,1);
    box-shadow: 0 2px 8px rgba(82,183,136,0.4);
  }
  .btn-check svg { width: 11px; height: 11px; }
  .menu-btn.selected .btn-check { opacity: 1; transform: scale(1); }

  .btn-name {
    font-size: 15px;
    font-family: 'M PLUS Rounded 1c', 'Noto Sans JP', sans-serif;
    font-weight: 800;
    color: var(--text-dark);
    line-height: 1.35;
    margin-bottom: 8px;
    padding-right: 24px;
  }
  .btn-footer {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 6px;
  }
  .btn-share-label {
    font-size: 10px;
    font-weight: 500;
    color: var(--text-light);
  }
  .btn-share-amount {
    font-size: 16px;
    font-weight: 900;
    color: var(--green-mid);
  }
  .btn-price-small {
    font-size: 10px;
    color: var(--text-light);
    font-weight: 500;
    white-space: nowrap;
  }

  /* SEARCH EMPTY */
  .search-empty {
    display: none;
    text-align: center;
    padding: 20px 0 8px;
    font-size: 13px;
    color: var(--text-light);
  }

  /* ── DAY SECTION ── */
  .day-section {
    margin-bottom: 28px;
    animation: fadeIn 0.4s ease both;
  }
  .day-section:nth-child(1) { animation-delay: 0.05s; }
  .day-section:nth-child(2) { animation-delay: 0.12s; }
  .day-section:nth-child(3) { animation-delay: 0.19s; }

  .day-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 12px;
    flex-wrap: wrap;
  }
  .day-pill {
    background: var(--green-deep);
    color: #fff;
    font-size: 13px;
    font-weight: 700;
    padding: 6px 18px;
    border-radius: 100px;
    letter-spacing: 0.05em;
    white-space: nowrap;
  }
  .day-date {
    font-size: 13px;
    color: var(--text-light);
    font-weight: 500;
  }
  .day-selected-name {
    flex: 1;
    font-size: 13px;
    font-weight: 700;
    color: var(--green-mid);
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .day-selected-name.empty { color: var(--text-light); font-weight: 400; font-style: italic; }
  .day-skip {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--text-light);
    cursor: pointer;
    user-select: none;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .day-skip input { accent-color: var(--green-mid); cursor: pointer; }

  /* SKIP CARD */
  .day-skip-card {
    background: var(--cream);
    border: 2px dashed rgba(26,61,43,0.12);
    border-radius: 12px;
    padding: 16px;
    text-align: center;
    color: var(--text-light);
    font-size: 13px;
    display: none;
  }
  .day-skip-card.active { display: block; }
  .day-closed-card {
    background: #f5f5f5;
    border: 2px solid rgba(0,0,0,0.08);
    border-radius: 12px;
    padding: 14px 16px;
    text-align: center;
    color: var(--text-light);
    font-size: 13px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }

  /* SELECTED SUMMARY CARD */
  .day-summary-card {
    background: var(--warm-white);
    border: 2px solid var(--green-bright);
    border-radius: 12px;
    padding: 14px 16px;
    display: none;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    box-shadow: 0 2px 12px rgba(82,183,136,0.12);
  }
  .day-summary-card.active {
    display: flex;
  }
  .day-summary-menu { font-size: 13px; font-weight: 700; color: var(--text-dark); flex: 1; }
  .day-summary-right { text-align: right; flex-shrink: 0; }
  .day-summary-share { font-size: 14px; font-weight: 900; color: var(--orange-accent); }
  .day-summary-price { font-size: 10px; color: var(--text-light); }
  .day-summary-clear {
    background: none; border: none;
    color: var(--text-light); font-size: 18px;
    cursor: pointer; padding: 2px 4px; line-height: 1;
    flex-shrink: 0;
    transition: color 0.15s;
  }
  .day-summary-clear:hover { color: #e05252; }

  /* SUMMARY BAR */
  .summary-bar {
    background: var(--warm-white);
    border-radius: var(--radius);
    padding: 24px 20px;
    margin-bottom: 28px;
    box-shadow: var(--shadow-card);
    border: 1px solid rgba(26,61,43,0.06);
  }
  .summary-rows {}
  .summary-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 0;
    border-bottom: 1px solid rgba(26,61,43,0.06);
    font-size: 14px;
    gap: 12px;
  }
  .summary-row:last-child { border-bottom: none; }
  .summary-row-day { font-weight: 700; color: var(--green-mid); min-width: 48px; }
  .summary-row-menu { flex: 1; color: var(--text-dark); font-size: 13px; }
  .summary-row-price { font-weight: 700; color: var(--text-dark); white-space: nowrap; font-size: 13px; }
  .summary-row-none { color: var(--text-light); font-style: italic; flex: 1; font-size: 13px; }
  .summary-total {
    margin-top: 16px;
    padding: 14px 18px;
    background: var(--green-pale);
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .summary-total-label { font-size: 13px; font-weight: 700; color: var(--green-deep); }
  .summary-total-amount { font-size: 22px; font-weight: 900; color: var(--green-deep); }
  .summary-total-amount small {
    font-size: 11px; font-weight: 500;
    color: var(--green-mid); margin-left: 4px;
  }

  /* SUBMIT */
  .submit-btn {
    width: 100%;
    padding: 18px;
    background: var(--green-deep);
    color: #fff;
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 16px;
    font-weight: 700;
    border: none;
    border-radius: var(--radius);
    cursor: pointer;
    letter-spacing: 0.06em;
    transition: background 0.2s, transform 0.15s, box-shadow 0.2s;
    box-shadow: 0 6px 24px rgba(26,61,43,0.3);
  }
  .submit-btn:hover {
    background: var(--green-mid);
    transform: translateY(-2px);
    box-shadow: 0 10px 32px rgba(26,61,43,0.4);
  }
  .submit-btn:active { transform: translateY(0); }
  .submit-btn-inner {
    display: flex; align-items: center; justify-content: center; gap: 10px;
  }

  /* ERROR */
  .error-msg {
    color: #e05252;
    font-size: 12px;
    font-weight: 600;
    margin-top: 8px;
    display: none;
  }
  .error-msg.visible { display: block; }

  /* SUCCESS */
  .success-screen {
    display: none;
    text-align: center;
    padding: 60px 20px;
  }
  .success-screen.visible { display: block; }
  .success-icon {
    font-size: 72px;
    margin-bottom: 20px;
    animation: pop 0.5s cubic-bezier(.34,1.4,.64,1);
  }
  @keyframes pop {
    from { transform: scale(0.4); opacity: 0; }
    to   { transform: scale(1);   opacity: 1; }
  }
  .success-title {
    font-family: 'DM Serif Display', serif;
    font-size: 32px;
    color: var(--green-deep);
    margin-bottom: 10px;
  }
  .success-sub { color: var(--text-light); font-size: 14px; line-height: 1.7; }
  .success-detail {
    margin-top: 24px;
    background: var(--green-pale);
    border-radius: var(--radius);
    padding: 20px;
    text-align: left;
    max-width: 480px;
    margin-left: auto;
    margin-right: auto;
  }
  .success-detail-row {
    display: flex;
    justify-content: space-between;
    font-size: 14px;
    padding: 6px 0;
    border-bottom: 1px solid rgba(26,61,43,0.08);
    gap: 12px;
  }
  .success-detail-row:last-child { border-bottom: none; }
  .success-detail-key { color: var(--green-mid); font-weight: 700; flex-shrink: 0; }
  .reset-btn {
    margin-top: 24px;
    padding: 12px 32px;
    background: transparent;
    border: 2px solid var(--green-mid);
    color: var(--green-mid);
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 14px;
    font-weight: 700;
    border-radius: 100px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .reset-btn:hover { background: var(--green-mid); color: #fff; }

  /* ANIMATIONS */
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .fade-in { animation: fadeIn 0.4s ease both; }
</style>
</head>
<body>

<!-- HEADER -->
<header class="header">
  <div class="header-inner">
    <div class="header-badge">Weekly Bento Order</div>
    <h1 class="header-title">お弁当<em>注文</em>フォーム</h1>
    <p class="header-sub">食べたいお弁当を選んで注文してください。<br>会社が半額（上限¥350）を負担します。</p>
    <div class="header-meta">
      <div class="header-meta-item">
        <div class="icon">📅</div>
        <span id="target-week">翌週 月・水・金</span>
      </div>
      <div class="header-meta-item">
        <div class="icon">💴</div>
        <span>会社負担 半額・上限¥350</span>
      </div>
    </div>
    <div class="deadline-chip">⏰ 締め切り：今週金曜 12:00</div>
  </div>
</header>

<!-- MAIN -->
<main class="main" id="form-area">

  <!-- 氏名 -->
  <div class="name-section fade-in">
    <div class="section-label">お名前 *</div>
    <div class="name-select-wrap">
      <select id="name-select">
        <option value="">── 選択してください ──</option>
        <option>社長</option>
        <option>小野塚</option>
        <option>佐藤</option>
        <option>黒田</option>
        <option>白石</option>
        <option>長谷川</option>
        <option>澤田</option>
        <option>萬石</option>
        <option>みちる</option>
        <option>荒木</option>
        <option>若栗</option>
        <option>加藤</option>
　　　 　<option>岩崎</option>
        <option>中村叶</option>
　　 　　<option>山崎</option>
　　　 　<option>髙梨</option>
　　　　 <option>中川</option>
　　　 　<option>太田</option>
     　  <option>原田</option>
         <option>杉木</option>  
       　<option>矢部</option>
　　　　　<option>野尻</option>
        <option>森山</option>
　　　　　<option>久保</option>
        <option>古滝</option>
        <option>若菜</option>
        <option>ちひろ</option>
        <option>淺見</option>
        <option>飛彩</option>
      </select>
    </div>
    <div class="error-msg" id="name-error">名前を選択してください</div>
  </div>

  <!-- メニュー選択 -->
  <div class="menu-section fade-in">
    <div class="menu-section-top">
      <div class="section-label" style="margin-bottom:0">メニューを選ぶ</div>
      <div class="search-wrap">
        <span class="search-icon">🔍</span>
        <input type="text" class="search-input" id="menu-search"
          placeholder="メニューを検索…"
          oninput="filterMenus(this.value)"
          onfocus="this.style.borderColor='var(--green-bright)'"
          onblur="this.style.borderColor=''">
        <button class="search-clear" id="search-clear" onclick="clearSearch()">✕</button>
      </div>
    </div>
    <div id="menu-area"></div>
    <div class="search-empty" id="search-empty">該当するメニューが見つかりません</div>
  </div>

  <!-- 曜日ごとの確認 -->
  <div id="days-container"></div>

  <!-- サマリー -->
  <div class="summary-bar fade-in">
    <div class="section-label">注文サマリー</div>
    <div class="summary-rows" id="summary-rows"></div>
    <div class="summary-total">
      <div class="summary-total-label">今週の自己負担合計</div>
      <div class="summary-total-amount" id="total-display">¥0<small>/ 今週</small></div>
    </div>
  </div>

  <!-- 送信 -->
  <div class="error-msg" id="order-error" style="margin-bottom:12px;font-size:13px;">少なくとも1日分を注文してください</div>
  <button class="submit-btn" id="submit-btn" onclick="handleSubmit()">
    <div class="submit-btn-inner">
      <span>注文を確定する</span>
      <span style="font-size:18px">→</span>
    </div>
  </button>
</main>

<!-- SUCCESS -->
<div class="main success-screen" id="success-screen">
  <div class="success-icon">🎉</div>
  <h2 class="success-title">注文完了！</h2>
  <p class="success-sub">ご注文を受け付けました。<br>変更・キャンセルは担当者までご連絡ください。</p>
  <div class="success-detail" id="success-detail"></div>
  <button class="reset-btn" onclick="resetForm()">別の注文を入力</button>
</div>

<script>
const GAS_URL = 'YOUR_GAS_URL_HERE';
const COMPANY_MAX = 350;

// ─────────────────────────────────────────────────────
// ✏️ 提供なし日の設定（休業日・祝日など）
// 選択不可にしたい日付を 'YYYY-MM-DD' 形式で追加してください
const CLOSED_DATES = [
  // '2025-05-01',
  // '2025-12-31',
];
// ─────────────────────────────────────────────────────

function calcCompany(price) {
  return Math.min(Math.floor(price / 2), COMPANY_MAX);
}
function calcShare(price) {
  return price - calcCompany(price);
}

// ── シリーズ・メニューデータ ──────────────────────
const SERIES = [
  { key: 's-deka',    label: 'デカからシリーズ',  color: '#c62828', bg: '#fff5f5', border: 'rgba(198,40,40,0.15)',
    items: [

    items: [

      { id:'MK2', name:'Mから',         price: 590 },
      { id:'MK3', name:'のりから明太M', price: 610 },

  },
  { key: 's-manpuku', label: '満腹シリーズ',       color: '#e65100', bg: '#fff8f3', border: 'rgba(230,81,0,0.14)',
    items: [
      { id:'M01', name:'満腹生姜焼き',               price: 740 },
      { id:'M02', name:'チーズハンバーグ＆生姜焼き', price: 740 },
      { id:'M03', name:'満腹かきあげ',               price: 780 },
      { id:'M04', name:'満腹ステーキ',               price: 920 },
    ]
  },
  { key: 's-deluxe',  label: 'デラックスシリーズ', color: '#b8860b', bg: '#fdfbf0', border: 'rgba(184,134,11,0.15)',
    items: [
      { id:'D01', name:'幕の内弁当',         price: 680 },
      { id:'D02', name:'和風からあげDX',     price: 620 },
      { id:'D03', name:'わいわいDX',         price: 660 },
      { id:'D04', name:'おろしカツ＆竜田DX', price: 690 },
    ]
  },
  { key: 's-itame',   label: '炎の炒めシリーズ',   color: '#2e7d32', bg: '#f4fbf4', border: 'rgba(46,125,50,0.14)',
    items: [
      { id:'I01', name:'肉野菜炒め',       price: 650 },
      { id:'I02', name:'豚キャベ味噌炒め', price: 650 },
      { id:'I03', name:'焼肉',             price: 650 },
      { id:'I04', name:'生姜焼き',         price: 650 },
    ]
  },
  { key: 's-nori',    label: 'のり弁当シリーズ',   color: '#ad1457', bg: '#fff4f8', border: 'rgba(173,20,87,0.14)',
    items: [
      { id:'N01', name:'得のり弁',     price: 490 },
      { id:'N02', name:'のりから',     price: 700 },
      { id:'N03', name:'のりから明太', price: 770 },
      { id:'N04', name:'超のり弁',     price: 700 },
    ]
  },
  { key: 's-go',      label: 'GO弁当シリーズ',     color: '#0277bd', bg: '#f2f9ff', border: 'rgba(2,119,189,0.14)',
    items: [
      { id:'G01', name:'のりからGO',     price: 450 },
      { id:'G02', name:'のり弁GO',       price: 400 },
      { id:'G03', name:'のりから白身GO', price: 490 },
      { id:'G04', name:'エビフライGO',   price: 470 },
    ]
  },
  { key: 's-sake',    label: '銀鮭シリーズ',       color: '#558b2f', bg: '#f5fbf0', border: 'rgba(85,139,47,0.14)',
    items: [
      { id:'S01', name:'銀鮭＆生姜焼き', price: 650 },
      { id:'S02', name:'銀鮭＆和風唐揚', price: 620 },
      { id:'S03', name:'銀鮭満腹',       price: 680 },
    ]
  },
  { key: 's-other',   label: 'その他',             color: '#546e7a', bg: '#f5f7f8', border: 'rgba(84,110,122,0.14)',
    items: [
      { id:'O02', name:'チキン南蛮',             price: 700 },
      { id:'O01', name:'塩さば弁当',             price: 650 },
      { id:'O05', name:'たっぷりチーズハンバーグ', price: 640 },
      { id:'O03', name:'カツカレー',             price: 640 },
      { id:'O04', name:'カレー',                 price: 450 },
      { id:'O06', name:'焼き肉1.5',              price: 780 },
      { id:'O07', name:'チャオ',                 price: 780 },
    ]
  },
];

const ALL_MENUS = SERIES.flatMap(s => s.items.map(m => ({ ...m, seriesKey: s.key, color: s.color })));

const DAYS = ['月', '水', '金'];
function getNextWeekDates() {
  const today = new Date();
  const dow = today.getDay();
  const daysToMon = (dow === 0) ? 1 : (8 - dow) % 7 || 7;
  const mon = new Date(today); mon.setDate(today.getDate() + daysToMon);
  const wed = new Date(mon); wed.setDate(mon.getDate() + 2);
  const fri = new Date(mon); fri.setDate(mon.getDate() + 4);
  const fmt    = d => `${d.getMonth()+1}/${d.getDate()}`;
  const fmtISO = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  return {
    labels: [fmt(mon), fmt(wed), fmt(fri)],
    isos:   [fmtISO(mon), fmtISO(wed), fmtISO(fri)],
  };
}
const { labels: dates, isos: dateISOs } = getNextWeekDates();

// 休業日チェック（CLOSED_DATESに含まれる曜日はロック）
const closedDays = { 月: false, 水: false, 金: false };
DAYS.forEach((day, i) => { closedDays[day] = CLOSED_DATES.includes(dateISOs[i]); });

const selections = { 月: null, 水: null, 金: null };
const skipped    = { 月: false, 水: false, 金: false };

// ── メニューエリア描画 ──────────────────────────
function renderMenuArea() {
  const area = document.getElementById('menu-area');
  area.innerHTML = SERIES.map(s => `
    <div class="series-block" data-series="${s.key}">
      <div class="series-label-row" style="--series-border:${s.color}; border-bottom-color:${s.color};">
        <span class="series-name">${s.label}</span>
      </div>
      <div class="menu-grid">
        ${s.items.map(m => {
          const share = calcShare(m.price);
          return `
          <button class="menu-btn" id="mbtn-${m.id}" onclick="tapMenu('${m.id}')"
            style="background:#fff; border-color:${s.border};">
            <div class="btn-check">
              <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="20 6 9 17 4 12"/>
              </svg>
            </div>
            <div class="btn-name">${m.name}</div>
            <div class="btn-footer">
              <div>
                <span class="btn-share-label">自己負担 </span>
                <span class="btn-share-amount">${m.price === 0 ? '—' : '¥' + share.toLocaleString()}</span>
              </div>
              <div class="btn-price-small">${m.price > 0 ? '定価 ¥' + m.price.toLocaleString() : ''}</div>
            </div>
          </button>`;
        }).join('')}
      </div>
    </div>
  `).join('');
}

// ── 曜日行描画 ──────────────────────────
function renderDays() {
  const container = document.getElementById('days-container');
  container.innerHTML = DAYS.map((day, di) => {
    const isClosed = closedDays[day];
    return `
    <div class="day-section" id="daysec-${day}">
      <div class="day-header">
        <div class="day-pill" ${isClosed ? 'style="background:var(--text-light)"' : ''}>${day}曜日</div>
        <div class="day-date">${dates[di]}</div>
        <div class="day-selected-name ${(!isClosed && selections[day]) ? '' : 'empty'}" id="dayname-${day}">
          ${isClosed ? '提供なし' : selections[day]
            ? ALL_MENUS.find(m => m.id === selections[day])?.name
            : (skipped[day] ? '— お休み —' : '未選択')}
        </div>
        ${isClosed ? '' : `
        <label class="day-skip">
          <input type="checkbox" id="skip-${day}" ${skipped[day] ? 'checked' : ''} onchange="toggleSkip('${day}')">
          お休み
        </label>`}
      </div>
      ${isClosed
        ? `<div class="day-closed-card">🔒 この日はお弁当の提供がありません</div>`
        : `<div class="day-skip-card ${skipped[day] ? 'active' : ''}" id="skipcard-${day}">
            — この日はお休み —
           </div>
           <div class="day-summary-card ${selections[day] ? 'active' : ''}" id="summarycard-${day}">
             ${selections[day] ? (() => {
               const m = ALL_MENUS.find(m => m.id === selections[day]);
               const share = calcShare(m.price);
               return `
                 <div class="day-summary-menu">${m.name}</div>
                 <div class="day-summary-right">
                   <div class="day-summary-share">${m.price > 0 ? '自己負担 ¥' + share.toLocaleString() : '価格未定'}</div>
                   <div class="day-summary-price">${m.price > 0 ? '定価 ¥' + m.price.toLocaleString() : ''}</div>
                 </div>
                 <button class="day-summary-clear" onclick="clearDay('${day}')">✕</button>`;
             })() : ''}
           </div>`}
    </div>
  `}).join('');
}

// ── タップ処理 ──────────────────────────
function tapMenu(menuId) {
  const existDay = DAYS.find(d => selections[d] === menuId);
  if (existDay) {
    selections[existDay] = null;
  } else {
    const target = DAYS.find(d => !skipped[d] && !closedDays[d] && !selections[d])
                || DAYS.find(d => !skipped[d] && !closedDays[d])
                || DAYS[0];
    selections[target] = menuId;
  }
  updateAll();
}

function clearDay(day) {
  selections[day] = null;
  updateAll();
}

function toggleSkip(day) {
  skipped[day] = document.getElementById(`skip-${day}`).checked;
  if (skipped[day]) selections[day] = null;
  updateAll();
}

function updateAll() {
  // ボタン状態
  const usedIds = new Set(Object.values(selections).filter(Boolean));
  ALL_MENUS.forEach(m => {
    const btn = document.getElementById(`mbtn-${m.id}`);
    if (!btn) return;
    btn.classList.toggle('selected', usedIds.has(m.id));
    btn.classList.toggle('dimmed', false);
  });

  // 曜日行を再描画
  renderDays();

  // サマリー更新
  let total = 0;
  const rows = document.getElementById('summary-rows');
  rows.innerHTML = DAYS.map((day, di) => {
    const menu = ALL_MENUS.find(m => m.id === selections[day]);
    const isSkip = skipped[day];
    if (menu) {
      const share = calcShare(menu.price);
      if (menu.price > 0) total += share;
      return `<div class="summary-row">
        <span class="summary-row-day">${day}曜</span>
        <span class="summary-row-menu">${menu.name}</span>
        <span class="summary-row-price">${menu.price > 0 ? '¥' + share.toLocaleString() + ' <span style="font-size:10px;color:var(--text-light)">（自己負担）</span>' : '価格未定'}</span>
      </div>`;
    }
    return `<div class="summary-row">
      <span class="summary-row-day">${day}曜</span>
      <span class="summary-row-none">${isSkip ? 'お休み' : '未選択'}</span>
      <span class="summary-row-price" style="color:var(--text-light)">—</span>
    </div>`;
  }).join('');
  document.getElementById('total-display').innerHTML = `¥${total.toLocaleString()}<small>/ 今週</small>`;
}

// ── 検索 ──────────────────────────
function filterMenus(query) {
  const q = query.trim();
  document.getElementById('search-clear').style.display = q ? 'block' : 'none';
  let anyVisible = false;
  SERIES.forEach(s => {
    const block = document.querySelector(`[data-series="${s.key}"]`);
    if (!block) return;
    let seriesHasMatch = false;
    s.items.forEach(m => {
      const btn = document.getElementById(`mbtn-${m.id}`);
      if (!btn) return;
      const match = !q || m.name.includes(q);
      btn.style.display = match ? '' : 'none';
      if (match) seriesHasMatch = true;
    });
    block.style.display = seriesHasMatch ? '' : 'none';
    if (seriesHasMatch) anyVisible = true;
  });
  document.getElementById('search-empty').style.display = anyVisible ? 'none' : 'block';
}

function clearSearch() {
  const input = document.getElementById('menu-search');
  input.value = '';
  filterMenus('');
  input.focus();
}

// ── 送信 ──────────────────────────
function handleSubmit() {
  let valid = true;
  const nameEl = document.getElementById('name-select');
  const nameErr = document.getElementById('name-error');
  const orderErr = document.getElementById('order-error');

  if (!nameEl.value) {
    nameEl.classList.add('error-field');
    nameErr.classList.add('visible');
    valid = false;
  } else {
    nameEl.classList.remove('error-field');
    nameErr.classList.remove('visible');
  }

  const hasOrder = DAYS.some(d => selections[d] !== null);
  if (!hasOrder) {
    orderErr.classList.add('visible');
    valid = false;
  } else {
    orderErr.classList.remove('visible');
  }
  if (!valid) return;

  let totalShare = 0;
  DAYS.forEach(d => {
    const menu = ALL_MENUS.find(m => m.id === selections[d]);
    if (menu && menu.price > 0) totalShare += calcShare(menu.price);
  });

  if (GAS_URL !== 'YOUR_GAS_URL_HERE') {
    fetch(GAS_URL, {
      method: 'POST',
      body: JSON.stringify({
        name: nameEl.value,
        mon: selections['月'] ? ALL_MENUS.find(m => m.id === selections['月']).name : '',
        wed: selections['水'] ? ALL_MENUS.find(m => m.id === selections['水']).name : '',
        fri: selections['金'] ? ALL_MENUS.find(m => m.id === selections['金']).name : '',
        totalShare,
      })
    }).catch(() => {});
  }

  document.getElementById('form-area').style.display = 'none';
  document.getElementById('success-screen').classList.add('visible');

  let html = `<div class="success-detail-row"><span class="success-detail-key">氏名</span><span>${nameEl.value}</span></div>`;
  DAYS.forEach((day, di) => {
    const menu = ALL_MENUS.find(m => m.id === selections[day]);
    const label = menu
      ? `${menu.name}${menu.price > 0 ? '（自己負担 ¥' + calcShare(menu.price).toLocaleString() + '）' : '（価格未定）'}`
      : (skipped[day] ? 'お休み' : '注文なし');
    html += `<div class="success-detail-row"><span class="success-detail-key">${day}曜 ${dates[di]}</span><span>${label}</span></div>`;
  });
  html += `<div class="success-detail-row"><span class="success-detail-key">自己負担合計</span><span>¥${totalShare.toLocaleString()}</span></div>`;
  document.getElementById('success-detail').innerHTML = html;
}

function resetForm() {
  DAYS.forEach(d => { selections[d] = null; skipped[d] = false; });
  document.getElementById('name-select').value = '';
  document.getElementById('success-screen').classList.remove('visible');
  document.getElementById('form-area').style.display = '';
  renderMenuArea();
  updateAll();
}

// ── Init ──────────────────────────
renderMenuArea();
renderDays();
updateAll();
document.getElementById('target-week').textContent =
  `翌週 ${dates[0]}(月)・${dates[1]}(水)・${dates[2]}(金)`;
</script>
</body>
</html>
