<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>注文確認</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=DM+Serif+Display:ital@0;1&family=M+PLUS+Rounded+1c:wght@700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --green-deep:   #1a3d2b;
    --green-mid:    #2d6a4f;
    --green-bright: #52b788;
    --green-pale:   #d8f3dc;
    --cream:        #faf7f2;
    --warm-white:   #fffef9;
    --orange-accent:#e07a2f;
    --orange-light: #fdf0e3;
    --text-dark:    #1c1c1c;
    --text-mid:     #4a4a4a;
    --text-light:   #8a8a8a;
    --shadow-card:  0 4px 24px rgba(26,61,43,0.10), 0 1px 4px rgba(26,61,43,0.06);
    --shadow-hover: 0 12px 40px rgba(26,61,43,0.18), 0 2px 8px rgba(26,61,43,0.10);
    --radius: 18px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: 'Noto Sans JP', sans-serif;
    background: var(--cream);
    color: var(--text-dark);
    min-height: 100vh;
  }

  /* HEADER */
  .header {
    background: var(--green-deep);
    position: relative;
    overflow: visible;
  }
  .header::before {
    content: '';
    position: absolute;
    top: -60px; right: -60px;
    width: 260px; height: 260px;
    background: radial-gradient(circle, rgba(82,183,136,0.18) 0%, transparent 70%);
    pointer-events: none;
  }
  .header-inner {
    max-width: 860px;
    margin: 0 auto;
    padding: 32px 20px 28px;
    position: relative;
    z-index: 1;
  }
  .header-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: rgba(82,183,136,0.18);
    border: 1px solid rgba(82,183,136,0.35);
    color: var(--green-bright);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.1em;
    padding: 5px 14px;
    border-radius: 100px;
    margin-bottom: 12px;
    text-transform: uppercase;
  }
  .header-title {
    font-family: 'DM Serif Display', serif;
    font-size: clamp(24px, 4vw, 36px);
    color: #fff;
    line-height: 1.2;
    margin-bottom: 8px;
  }
  .header-title em { font-style: italic; color: var(--green-bright); }
  .header-sub {
    color: rgba(255,255,255,0.55);
    font-size: 13px;
  }
  .header-week {
    margin-top: 16px;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--orange-accent);
    color: #fff;
    font-size: 13px;
    font-weight: 700;
    padding: 8px 18px;
    border-radius: 100px;
    box-shadow: 0 4px 16px rgba(224,122,47,0.4);
  }

  /* MAIN */
  .main {
    max-width: 860px;
    margin: 0 auto;
    padding: 28px 16px 80px;
  }

  /* LOADING / ERROR */
  .state-card {
    background: var(--warm-white);
    border-radius: var(--radius);
    padding: 48px 20px;
    text-align: center;
    box-shadow: var(--shadow-card);
    border: 1px solid rgba(26,61,43,0.06);
  }
  .state-icon { font-size: 48px; margin-bottom: 16px; }
  .state-title { font-size: 16px; font-weight: 700; color: var(--text-dark); margin-bottom: 8px; }
  .state-sub { font-size: 13px; color: var(--text-light); line-height: 1.7; }
  .spinner {
    width: 36px; height: 36px;
    border: 3px solid var(--green-pale);
    border-top-color: var(--green-bright);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 16px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* TABLE */
  .table-wrap {
    background: var(--warm-white);
    border-radius: var(--radius);
    box-shadow: var(--shadow-card);
    border: 1px solid rgba(26,61,43,0.06);
    overflow: hidden;
    margin-bottom: 24px;
  }
  .table-header {
    padding: 18px 20px 12px;
    border-bottom: 1px solid rgba(26,61,43,0.06);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }
  .table-title {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--green-mid);
  }
  .refresh-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 7px 14px;
    background: var(--green-pale);
    border: none;
    border-radius: 100px;
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 12px;
    font-weight: 700;
    color: var(--green-deep);
    cursor: pointer;
    transition: background 0.2s, transform 0.15s;
  }
  .refresh-btn:hover { background: var(--green-bright); color: #fff; transform: translateY(-1px); }
  .refresh-btn.loading .refresh-icon { animation: spin 0.8s linear infinite; }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  thead tr {
    background: var(--green-deep);
    color: #fff;
  }
  thead th {
    padding: 12px 14px;
    font-weight: 700;
    font-size: 12px;
    letter-spacing: 0.05em;
    text-align: left;
    white-space: nowrap;
  }
  thead th:first-child { border-radius: 0; }
  tbody tr {
    border-bottom: 1px solid rgba(26,61,43,0.05);
    transition: background 0.12s;
  }
  tbody tr:last-child { border-bottom: none; }
  tbody tr:hover { background: rgba(82,183,136,0.04); }
  /* 本人の行：オレンジの枠で囲む＋うっすらオレンジ背景 */
  tbody tr.highlight td { background: var(--orange-light); border-top: 2px solid var(--orange-accent); border-bottom: 2px solid var(--orange-accent); }
  tbody tr.highlight td:first-child { border-left: 2px solid var(--orange-accent); }
  tbody tr.highlight td:last-child { border-right: 2px solid var(--orange-accent); }
  /* 「あなたの注文」バッジ */
  .you-badge {
    display: inline-block;
    margin-left: 8px;
    font-size: 10px;
    font-weight: 800;
    color: #fff;
    background: var(--orange-accent);
    padding: 2px 8px;
    border-radius: 100px;
    letter-spacing: 0.03em;
    vertical-align: middle;
    white-space: nowrap;
  }
  td {
    padding: 12px 14px;
    vertical-align: top;
    color: var(--text-dark);
  }
  td.name-cell {
    font-weight: 700;
    color: var(--green-deep);
    white-space: nowrap;
    min-width: 72px;
  }
  td.menu-cell { min-width: 100px; }
  .menu-tag {
    display: inline-block;
    background: var(--green-pale);
    color: var(--green-deep);
    font-size: 11px;
    font-weight: 700;
    font-family: 'M PLUS Rounded 1c', sans-serif;
    padding: 3px 10px;
    border-radius: 100px;
    margin: 2px 2px 2px 0;
    white-space: nowrap;
  }
  .empty-cell {
    color: var(--text-light);
    font-style: italic;
    font-size: 12px;
  }
  td.total-cell {
    font-weight: 900;
    color: var(--green-mid);
    white-space: nowrap;
  }
  td.ts-cell {
    color: var(--text-light);
    font-size: 11px;
    white-space: nowrap;
  }

  /* EMPTY STATE */
  .empty-row td {
    text-align: center;
    padding: 40px;
    color: var(--text-light);
    font-size: 14px;
  }

  /* WEEK FILTER */
  .filter-bar {
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
    flex-wrap: wrap;
    align-items: center;
  }
  .filter-label {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-light);
    margin-right: 4px;
  }
  .week-chip {
    padding: 6px 16px;
    border-radius: 100px;
    border: 2px solid rgba(26,61,43,0.10);
    background: var(--warm-white);
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 12px;
    font-weight: 700;
    color: var(--text-mid);
    cursor: pointer;
    transition: all 0.15s;
  }
  .week-chip:hover { border-color: var(--green-bright); color: var(--green-deep); }
  .week-chip.active {
    background: var(--green-deep);
    border-color: var(--green-deep);
    color: #fff;
  }

  /* BACK LINK */
  .back-link {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    color: var(--green-mid);
    font-size: 13px;
    font-weight: 700;
    text-decoration: none;
    margin-bottom: 20px;
    transition: color 0.15s;
  }
  .back-link:hover { color: var(--green-deep); }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .fade-in { animation: fadeIn 0.4s ease both; }
</style>
</head>
<body>

<header class="header">
  <div class="header-inner">
    <div style="display:flex; align-items:center; gap:12px; flex-wrap:wrap;">
      <div class="header-badge">Order Status</div>
      <span style="font-family:'DM Serif Display',serif; font-size:20px; color:#fff; font-weight:700; font-style:normal;">注文<em style="color:var(--green-bright); font-style:normal;">確認</em>ページ</span>
    </div>
    <div style="display:flex; align-items:center; gap:16px; flex-wrap:wrap;">
  
    </div>
    <div class="header-week" id="header-week">📅 読み込み中…</div>

  </div>
</header>

<main class="main">
  <a href="ryuchan.bento.html" class="back-link">← 注文フォームに戻る</a>

  <!-- ローディング -->
  <div class="state-card fade-in" id="loading-state">
    <div class="spinner"></div>
    <div class="state-title">注文データを取得中…</div>
    <div class="state-sub">しばらくお待ちください</div>
  </div>

  <!-- エラー -->
  <div class="state-card fade-in" id="error-state" style="display:none">
    <div class="state-icon">⚠️</div>
    <div class="state-title">データを取得できませんでした</div>
    <div class="state-sub" id="error-msg">GAS_URLが正しく設定されているか確認してください</div>
    <button class="refresh-btn" style="margin:16px auto 0" onclick="loadOrders(true)">再読み込み</button>
  </div>

  <!-- メインコンテンツ -->
  <div id="main-content" style="display:none">

    <!-- 週フィルター -->
    <div class="filter-bar fade-in" id="filter-bar">

    </div>

    <!-- テーブル -->
    <div class="table-wrap fade-in">
      <div class="table-header">
        <div class="table-title">注文一覧　<span style="font-size:12px;font-weight:400;color:var(--text-light);">→ にスクロール</span></div>
        <button class="refresh-btn" id="refresh-btn" onclick="loadOrders(true)">
          <span class="refresh-icon">↻</span> 更新
        </button>
      </div>
      <div style="overflow-x:auto; border-radius:0 0 18px 18px;">
        <table>
          <thead>
            <tr>
              <th>氏名</th>
              <th>自己負担合計</th>
              <th>火曜</th>
              <th>木曜</th>
              <th>金曜</th>
              <th>送信日時</th>
            </tr>
          </thead>
          <tbody id="order-table-body">
            <tr class="empty-row"><td colspan="6">データがありません</td></tr>
          </tbody>
        </table>
      </div>
    </div>

  </div>
</main>

<script>
const GAS_URL = 'https://script.google.com/macros/s/AKfycbzJYJXs_LFockYhkWHxIr-4_j9bDXIv2yaytrEwTiGJhnPEoKHjmouHcFPKa2azEhL7/exec';

// 休業日（提供なし）の日付。注文フォームと同じ内容にしておく
const CLOSED_DATES = [
  '2026-04-03',
  '2025-05-01',
  '2026-06-01',
  '2026-07-24',
  '2026-08-13',
  '2026-08-14',
  '2026-10-12',
  '2026-12-31',
  '2027-01-01',
  '2027-01-02',
];

document.getElementById('header-week').textContent = '📅 読み込み中…';

let allOrders = [];
let selectedWeek = null;
// 注文フォームから引き継いだ「注文した人」と「注文した週」
const params = new URLSearchParams(window.location.search);
const justOrderedName = params.get('name') || null;
const justOrderedWeek = params.get('week') || null;

async function loadOrders(force = false) {
  const btn = document.getElementById('refresh-btn');
  if (btn) btn.classList.add('loading');

  // すでに表示中なら「読み込み中…」で消さず、裏で更新する（初回のみ読み込み画面）
  const hasData = allOrders && allOrders.length > 0;
  if (!hasData) {
    document.getElementById('loading-state').style.display = '';
    document.getElementById('error-state').style.display = 'none';
    document.getElementById('main-content').style.display = 'none';
  }

  try {
    if (GAS_URL === 'YOUR_GAS_URL_HERE') throw new Error('GAS_URLを設定してください');

    // キャッシュを完全に無視して最新を取得
    const url = GAS_URL + (GAS_URL.includes('?') ? '&' : '?') + '_=' + Date.now();
    const res = await fetch(url, { cache: 'no-store' });
    const json = await res.json();
    allOrders = json.orders || [];

    const weeks = getWeeks();
    if (!selectedWeek || !weeks.includes(selectedWeek)) {
      // 注文フォームから来た場合はその週を、なければ最新週を最初に表示
      if (justOrderedWeek && weeks.includes(justOrderedWeek)) {
        selectedWeek = justOrderedWeek;
      } else {
        selectedWeek = weeks.length ? weeks[weeks.length - 1] : null;
      }
    }

    renderAll();

    document.getElementById('loading-state').style.display = 'none';
    document.getElementById('main-content').style.display = '';
  } catch (err) {
    document.getElementById('loading-state').style.display = 'none';
    document.getElementById('error-state').style.display = '';
    document.getElementById('error-msg').textContent = err.message;
  }

  if (btn) btn.classList.remove('loading');
}

function renderAll() {
  updateHeaderWeek();
  renderWeekFilter();
  renderTable();
}

// 上部バナーを、今選んでいる週（提供なしの曜日を除いた表記）に更新
function updateHeaderWeek() {
  const el = document.getElementById('header-week');
  if (!el) return;
  el.textContent = '📅 ' + (selectedWeek ? labelForWeek(selectedWeek) : '注文はまだありません');
}

function getWeeks() {
  // 週ラベルを集めて、今日に近い直近3週を古い順（左→右）に並べる
  const set = [];
  allOrders.forEach(o => {
    if (o.weekLabel && !set.includes(o.weekLabel)) set.push(o.weekLabel);
  });
  const today = new Date();
  const toDate = (label) => {
    const m = label.match(/(\d+)\/(\d+)/);
    if (!m) return null;
    const month = Number(m[1]);
    const day = Number(m[2]);
    const y = today.getFullYear();
    let d = new Date(y, month - 1, day);
    const diffDays = (d - today) / 86400000;
    if (diffDays > 182) d = new Date(y - 1, month - 1, day);
    else if (diffDays < -182) d = new Date(y + 1, month - 1, day);
    return d;
  };
  const withDate = set.map(label => {
    const d = toDate(label);
    return { label, time: d ? d.getTime() : -Infinity };
  });
  const sortedByCloseness = withDate.slice().sort((a, b) =>
    Math.abs(a.time - today.getTime()) - Math.abs(b.time - today.getTime())
  );
  const top3 = sortedByCloseness.slice(0, 3);
  top3.sort((a, b) => a.time - b.time);
  return top3.map(x => x.label);
}

function getFilteredOrders() {
  if (!selectedWeek) return allOrders;
  return allOrders.filter(o => o.weekLabel === selectedWeek);
}

// ── 週ラベルの日付を取り出す（金曜が欠けていれば火曜基準で補う）──
function parseWeek(raw) {
  let tue = (raw.match(/(\d+\/\d+)\(火\)/) || [])[1] || null;
  let thu = (raw.match(/(\d+\/\d+)\(木\)/) || [])[1] || null;
  let fri = (raw.match(/(\d+\/\d+)\(金\)/) || [])[1] || null;
  const y = new Date().getFullYear();
  const addDays = (md, n) => {
    const [mm, dd] = md.split('/').map(Number);
    const d = new Date(y, mm - 1, dd + n);
    return `${d.getMonth() + 1}/${d.getDate()}`;
  };
  if (tue) {
    if (!thu) thu = addDays(tue, 2);
    if (!fri) fri = addDays(tue, 3);
  } else if (thu) {
    if (!tue) tue = addDays(thu, -2);
    if (!fri) fri = addDays(thu, 1);
  }
  return { 火: tue, 木: thu, 金: fri };
}

// M/D が休業日かどうか（今年を基準に判定）
function isClosedMD(md) {
  if (!md) return false;
  const [m, d] = md.split('/').map(Number);
  const y = new Date().getFullYear();
  const iso = `${y}-${String(m).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
  return CLOSED_DATES.includes(iso);
}

// タブ・バナー用：お休みの曜日を除いた日付表記
function labelForWeek(raw) {
  const w = parseWeek(raw);
  const parts = [];
  if (w.火 && !isClosedMD(w.火)) parts.push(`${w.火}(火)`);
  if (w.木 && !isClosedMD(w.木)) parts.push(`${w.木}(木)`);
  if (w.金 && !isClosedMD(w.金)) parts.push(`${w.金}(金)`);
  return parts.length ? parts.join('・') : raw;
}

function renderWeekFilter() {
  const bar = document.getElementById('filter-bar');
  const weeks = getWeeks();
  bar.innerHTML = '';

  // 週タブを最初から横に並べる（注文フォームと同じ形）
  weeks.forEach(w => {
    const btn = document.createElement('button');
    btn.className = 'week-chip' + (selectedWeek === w ? ' active' : '');
    btn.textContent = labelForWeek(w);
    btn.onclick = () => { selectedWeek = w; renderAll(); };
    bar.appendChild(btn);
  });
}

// セル表示：提供なしの曜日は「提供なし」、それ以外は注文があればタグ・なければ「—」
function menuCell(menuStr, isClosed) {
  if (isClosed) return '<span class="empty-cell">提供なし</span>';
  menuStr = menuStr ? String(menuStr) : '';
  if (!menuStr.trim()) return '<span class="empty-cell">—</span>';
  return menuStr.split('・').map(m => `<span class="menu-tag">${m}</span>`).join('');
}

function renderTable() {
  const orders = getFilteredOrders();
  const tbody = document.getElementById('order-table-body');

  if (!orders.length) {
    tbody.innerHTML = '<tr class="empty-row"><td colspan="6">注文がありません</td></tr>';
    return;
  }

  // この週でお休みの曜日を判定
  const wk = selectedWeek ? parseWeek(selectedWeek) : { 火: null, 木: null, 金: null };
  const closedTue = isClosedMD(wk.火);
  const closedThu = isClosedMD(wk.木);
  const closedFri = isClosedMD(wk.金);

  // 最新順に表示（これまで通り：最近注文した人が上）
  let sorted = [...orders].reverse();

  // 注文フォームから移動してきたときだけ、本人を一番上に持ってくる
  if (justOrderedName) {
    const mineRows = sorted.filter(o => o.name === justOrderedName && (o.weekLabel || null) === selectedWeek);
    const others   = sorted.filter(o => !(o.name === justOrderedName && (o.weekLabel || null) === selectedWeek));
    sorted = [...mineRows, ...others];
  }

  tbody.innerHTML = sorted.map(o => {
    // 注文フォームから来た本人の行は目立たせる
    const isMine = justOrderedName && o.name === justOrderedName
      && (o.weekLabel || null) === selectedWeek;
    return `
    <tr class="${isMine ? 'highlight' : ''}" ${isMine ? 'id="my-order-row"' : ''}>
      <td class="name-cell">${o.name || ''}${isMine ? '<span class="you-badge">あなたの注文</span>' : ''}</td>
      <td class="total-cell">${o.total ? '¥' + Number(o.total).toLocaleString() : '—'}</td>
      <td class="menu-cell">${menuCell(o.tue, closedTue)}</td>
      <td class="menu-cell">${menuCell(o.thu, closedThu)}</td>
      <td class="menu-cell">${menuCell(o.fri, closedFri)}</td>
      <td class="ts-cell">${o.ts || ''}</td>
    </tr>`;
  }).join('');

  // 本人の行が画面に見えるよう軽くスクロール
  const mine = document.getElementById('my-order-row');
  if (mine) {
    setTimeout(() => mine.scrollIntoView({ behavior: 'smooth', block: 'center' }), 300);
  }
}

// スマホの「戻る」で戻ってきた時（bfcache）にも最新へ更新
window.addEventListener('pageshow', function (e) {
  if (e.persisted) loadOrders();
});

// ── 初回読み込み（これが抜けると「取得中…」のまま止まる）──
loadOrders();

// 注文直後にこのページへ来た場合、保存が反映されるまで少し待って再取得する
// （火・木・金は1件ずつ保存されるので、直後は火曜だけのことがある。数秒後に自動で3日そろう）
if (justOrderedName) {
  setTimeout(() => loadOrders(), 1500);
  setTimeout(() => loadOrders(), 3000);
  setTimeout(() => loadOrders(), 5000);
}
</script>
</body>
</html>
